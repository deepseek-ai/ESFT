[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esft"
version = "1.0.0"
description = "Expert Specialized Fine-Tuning for MoE models"
readme = "README.md"
license = {file = "LICENSE-CODE"}
authors = [
    {name = "DeepSeek-AI", email = "service@deepseek.com"},
]
keywords = ["deep-learning", "moe", "fine-tuning", "expert-parallelism", "pytorch", "transformers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "torch >= 1.10.0",
    "transformers >= 4.38.0",
    "safetensors >= 0.3.0",
]

[project.optional-dependencies]
eval = [
    "vllm",
    "datasets",
]

[project.urls]
Homepage = "https://github.com/deepseek-ai/ESFT"
Repository = "https://github.com/deepseek-ai/ESFT"
Issues = "https://github.com/deepseek-ai/ESFT/issues"

[tool.setuptools]
py-modules = ["esft", "utils", "benchmarks", "train", "train_ep", "eval_multigpu"]
packages = ["deepseek", "configs", "datasets", "scripts"]
